[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "protein_ss"
version = "0.0.1"
description = "Exploring implementation of MLM pre-training of AA encoder and protein secondary structure prediction with its encodings."
authors = [
  { name = "Jesse" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["protein_ss"]
include = ["pyproject.toml", "protein_ss/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["protein_ss"]
force-sort-within-sections = true

